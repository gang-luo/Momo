task: molopd

model:
  student_model_name_or_path: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  base_retention_model_name_or_path: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  tokenizer_name_or_path: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  base_teacher_model_name_or_path: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  use_lora_for_student: true
  trust_remote_code: false
  torch_dtype: null
  student_lora:
    r: 8
    alpha: 16
    dropout: 0.05
    bias: none
    target_modules: null

teachers:
  fda_adapter_path: pretrained_mol/teachers/fda_lora
  target_adapters:
    - name: target1
      adapter_path: pretrained_mol/teachers/target1_lora
      weight: 1.0
    - name: target2
      adapter_path: pretrained_mol/teachers/target2_lora
      weight: 1.0

loss:
  lambda_fda: 0.5
  lambda_base: 0.1
  lambda_targets:
    target1: 1.0
    target2: 1.0
  base_kl_direction: student_to_base
  lambda_nll: 0.0
  use_sequence_reward: false

sampling:
  prompt: "C"
  num_samples_per_step: 64
  max_new_tokens: 128
  temperature: 1.0
  top_p: 0.95
  top_k: 50
  keep_duplicates: false
  max_length: 256

optimizer:
  name: adamw
  lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip: 1.0

scheduler:
  name: cosine
  t_max: 10000
  eta_min: 1.0e-6

trainer:
  max_epochs: 1
  max_steps: 10000
  precision: bf16-mixed
  accelerator: gpu
  devices: 1
  strategy: auto
  ddp_static_graph: false
  ddp_find_unused_parameters: true
  log_every_n_steps: 10
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  gradient_clip_val: 1.0

checkpoint:
  save_top_k: -1
  save_last: true
  every_n_train_steps: 500
  filename: molopd-{step}
  log_lr: true

logging:
  use_wandb: true
  project: MolOPD
  run_name: novomolgen_molopd_main
  entity: null
  api_key: ""
  log_model: false

runtime:
  output_dir: outputs/molopd_main
  seed: 56
  resume: false

evaluators:
  use_rdkit_eval_for_logging: true
  use_admet: false
  use_fda_likeness_classifier: false
