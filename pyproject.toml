[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "momo-molopd"
version = "0.1.0"
dependencies = [
  "torch>=2.2",
  "pytorch-lightning>=2.2",
  "transformers>=4.41",
  "datasets>=2.19",
  "peft>=0.11",
  "wandb>=0.17",
  "rdkit",
  "omegaconf>=2.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
