task: opd
data:
  model_name: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  train_path: momo_molopd/data/student_train.jsonl
  val_path: momo_molopd/data/student_val.jsonl
  test_path: momo_molopd/data/student_test.jsonl
  batch_size: 8
  num_workers: 4
model:
  student_model_name: chandar-lab/NovoMolGen_32M_SMILES_AtomWise
  teacher_adapter_paths:
    - pretrained_mol/teachers/fda_lora
    - pretrained_mol/teachers/target1_lora
    - pretrained_mol/teachers/target2_lora
  teacher_weights: [0.4, 0.3, 0.3]
  lr: 1e-4
  t_max: 1000
  eta_min: 1e-6
  eval_num_samples: 128
  eval_prompt: "C"
  eval_max_new_tokens: 64
trainer:
  max_epochs: 10
  precision: bf16-mixed
  accelerator: gpu
  devices: [0,1]
  log_every_n_steps: 10
  accumulate_grad_batches: 4
  num_sanity_val_steps: 1
  strategy: ddp
  ddp_static_graph: false
  ddp_find_unused_parameters: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  monitor: val/opd_loss
  monitor_mode: min
wandb:
  disabled: false
  project: IgGM
  run_name: iggm-stage_time
  entity: "mllm-csu"
  api_key: "wandb_v1_XXXXX"
runtime:
  output_dir: outputs/lightning_train
  seed: 56
  resume: false
  run_test: true
